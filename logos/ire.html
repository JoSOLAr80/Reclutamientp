<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@500;700;800&display=block" rel="stylesheet">
<style>body{margin:0;font-family:Inter}.kit{width:1200px;padding:56px;box-sizing:border-box;background:#F7F7F5}
h1{font:700 22px Inter;margin:0 0 28px;color:#222}
.lock{display:flex;align-items:center;gap:36px;padding:44px;border-radius:16px}
.lock img{width:170px;height:170px;border-radius:50%}
.name{font:800 110px/0.9 Outfit;letter-spacing:-2px}.name span{color:#C1121F}
.tag{font:800 18px Inter;letter-spacing:9px;margin-top:14px}
.dark{background:#141414}.dark .name{color:#fff}.dark .tag{color:#F2E8DC}
.light{background:#fff;border:1px solid #ddd;margin-top:24px}.light .name{color:#141414}.light .tag{color:#C1121F}
.pal{display:flex;gap:16px;margin-top:24px}.sw{flex:1;border-radius:14px;overflow:hidden;border:1px solid #ddd;background:#fff}
.sw div{height:110px}.sw p{margin:0;padding:12px 16px 2px;font:700 18px Inter;color:#222}.sw small{display:block;padding:0 16px 14px;color:#666;font-size:14px}</style></head><body>
<section class="kit" id="kit"><h1>Iré Publicidad · la buena fortuna para tu negocio</h1>
<div class="lock dark"><img src="ire-icono.svg"><div><div class="name">IR<span>É</span></div><div class="tag">PUBLICIDAD</div></div></div>
<div class="lock light"><img src="ire-icono.svg"><div><div class="name">IR<span>É</span></div><div class="tag">PUBLICIDAD</div></div></div>
<div class="pal">
<div class="sw"><div style="background:#C1121F"></div><p>#C1121F</p><small>Rojo Irosun · Ícono, acento</small></div>
<div class="sw"><div style="background:#141414"></div><p>#141414</p><small>Negro carbón · Fondo, texto</small></div>
<div class="sw"><div style="background:#FFFFFF"></div><p>#FFFFFF</p><small>Blanco · Texto, fondos</small></div>
<div class="sw"><div style="background:#F2E8DC"></div><p>#F2E8DC</p><small>Arena · Fondos cálidos</small></div>
</div></section></body></html>
